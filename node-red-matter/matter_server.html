<script type="text/javascript">
    RED.nodes.registerType('matterServer',{
        category: 'input',
        color: '#008B8B',
        defaults: {
            name: {value:""},
            host: {value:"", required:true},
            port: {value:"5580", required:true, validate:RED.validators.number()},
            renaming:{value:"{}",required:true},
            statusPrefix:{value:""},
            eventPrefix:{value:""},
            onlinePrefix:{value:""},
            contextVar:{value:""}
        },
        inputs:1,
        outputs:4,
        icon: "matter.svg",
        label: function() {
            return this.name||this.host||"Matter Server";
        },
        labelStyle: function() {
            return this.name?"node_label_italic":"";
        },
        paletteLabel: "Matter",
        inputLabels: 'command',
        outputLabels: ['received data','received events','node online state','connection status'],
        oneditprepare: function() {
            const node = this;
            // Devices-List
            const renamingsList = $("#node-input-renaming-container").css('min-height','150px').css('min-width','450px').editableList({
                addItem: function(container,i,rename) {
                    container.css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap'
                    });
                    const row = $('<div/>').appendTo(container);
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('id')
                        .appendTo(row);
                    const propertyId = $('<input/>',{class:"node-input-renaming-id",type:"text"})
                        .css("width","70")
                        .appendTo(row)
                        .typedInput({types:['num']});
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('/')
                        .appendTo(row);
                    const propertyEndpoint = $('<input/>',{class:"node-input-renaming-endpoint",type:"text"})
                        .css("width","60")
                        .appendTo(row)
                        .typedInput({types:['num']});
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('name')
                        .appendTo(row);
                    const propertyName = $('<input/>',{class:"node-input-renaming-name",type:"text"})
                        .css("width","350")
                        .appendTo(row)
                        .typedInput({types:['str']});
                    propertyId      .typedInput('value',rename.id      ?? "");
                    propertyEndpoint.typedInput('value',rename.edpoint ?? 0);
                    propertyName    .typedInput('value',rename.name    ?? "");
                },
                sortable: true,
                removable: true
            });
            console.log(this.renaming)
            const help = JSON.parse( this.renaming ?? "[]" );
            for( const v of help ) {
                renamingsList.editableList('addItem',v);
            }
        },
        oneditresize: function(size) {
            const rows = $("#dialog-form>div:not(.node-input-renaming-container-row)");
            let height = size.height;
            for(let i=0; i<rows.length; i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            const editorRow = $("#dialog-form>div.node-input-renaming-container-row");
            height -= (parseInt(editorRow.css("marginTop"))+parseInt(editorRow.css("marginBottom")));
            $("#node-input-renaming-container").editableList('height',height);
        },
        oneditsave: function() {
            const renaming = $("#node-input-renaming-container").editableList('items');
            let help = [];
            renaming.each(function(i) {
                const rename = $(this);
                const id       = rename.find(".node-input-renaming-id")      .typedInput('value');
                const endpoint = rename.find(".node-input-renaming-endpoint").typedInput('value');
                const name     = rename.find(".node-input-renaming-name")    .typedInput('value');
                help.push( { id: id, endpoint: endpoint, name: name } );
            });
            console.log(JSON.stringify( help ))
            this.renaming = JSON.stringify( help );
        }
    });
</script>

<script type="text/x-red" data-template-name="matterServer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-server"></i> Hostname</label>
        <input type="text" id="node-input-host">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> Port</label>
        <input type="text" id="node-input-port"></input>
    </div>
    <div class="form-row">
        <label for="node-input-statusPrefix"><i class="fa fa-star"></i> Status-Prefix</label>
        <input type="text" id="node-input-statusPrefix"></input>
    </div>
    <div class="form-row">
        <label for="node-input-eventPrefix"><i class="fa fa-star-o"></i> Event-Prefix</label>
        <input type="text" id="node-input-eventPrefix"></input>
    </div>
    <div class="form-row">
        <label for="node-input-onlinePrefix"><i class="fa fa-star-o"></i> Online-Prefix</label>
        <input type="text" id="node-input-onlinePrefix"></input>
    </div>
    <div class="form-row">
        <label for="node-input-contextVar"><i class="fa fa-database"></i> Context-Variable</label>
        <input type="text" id="node-input-contextVar"></input>
    </div>
    <div class="form-row node-input-renaming-container-row">
        <label for="node-input-renaming"><i class="fa fa-bluetooth-b"></i> Node Renaming</label>
        <ol id="node-input-renaming-container"></ol>
    </div>
</script>

<script type="text/x-red" data-help-name="matterServer">

    <p>.</p>
    
    <h3>Input</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> <code>open</code>, <code>close</code> or name of the config parameter to be written</dd>
        <dt>payload <span class="property-type">number / string</span></dt>
        <dd> value of the config parameter to be written</dd>
    </dl>
    
    <h3>Outputs</h3>
    
    <h4>subscribed data</h4>
    <p>Cyclic output of the subscribed data points.</p>
    
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd> received data points. It is an object with key/value pairs.</dd>
    </dl>
    
    <h4>config data</h4>
    <p>Config data of the FEMS.</p>
    
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd> received config data.</dd>
    </dl>

    <h4>state</h4>
    <p>Actual state of the websocket connection.</p>

    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd> state of the websocket.</dd>
    </dl>
    
    <h3>Parameters</h3>
    <dl class="message-properties">
        <dt>fems <span class="property-type">feneconFems</span></dt>
        <dd> configuration of the FEMS.</dd>
        <dt>Edge <span class="property-type">string</span></dt>
        <dd> id of the edge; normally <code>"0"</code>.</dd>
        <dt>Inlist <span class="property-type">array</span></dt>
        <dd> list of subscribed data points.</dd>
        <dt>Risk <span class="property-type">boolean</span></dt>
        <dd> risk accepted, enables writing.</dd>
        <dt>Timeout <span class="property-type">boolean</span></dt>
        <dd> send <code>"timeout"</code> as state, if 10s no subscribed message arrives.</dd>
    </dl>
    
</script>

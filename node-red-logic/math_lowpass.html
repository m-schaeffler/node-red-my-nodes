<script type="text/javascript">
    RED.nodes.registerType('lowpass',{
        category: 'logic',
        color: "#C0DEED",
        defaults: {
            name:{value:""},
            topic:{value:""},
            property:{value:"payload", required:true},
            propertyType:{value:"msg"},
            alpha:{value:0.5, validate:RED.validators.number(), required:true },
            beta:{value:0.5, validate:RED.validators.number(), required:true },
            filter:{value:0, validate:RED.validators.number()},
            filterUnit:{value:"secs"},
            filterVal:{value:0, validate:RED.validators.number()},
            filterMul:{value:10, validate:RED.validators.number()},
            zeroIsZero:{value:false},
            decimals:{validate:RED.validators.number()},
            showState:{value:false}
        },
        inputs:1,
        outputs:1,
        icon:"lowpassfilter.svg",
        label: function() {
            return this.name||this.topic||"lowPass";
        },
        labelStyle: function() {
            return this.name?"node_label_italic":"";
        },
        paletteLabel: "lowPass",
        inputLabels: 'input',
        outputLabels: 'output',
        oneditprepare: function() {
            const node = this;
            $("#node-input-property").typedInput({
                type:"msg",
                types:["msg","jsonata"],
                typeField: "#node-input-propertyType"
            });
        }
    });
</script>

<script type="text/html" data-template-name="lowpass">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-envelope-o"></i> topic</label>
        <input type="text" id="node-input-topic" placeholder="Topic">
    </div>
    <div class="form-row">
        <label for="node-input-property"> measured value</label>
        <input type="text" id="node-input-property">
        <input type="hidden" id="node-input-propertyType">
    </div>
    <div class="form-row">
        <label for="node-input-alpha"> alpha</label>
        <input type="text" id="node-input-alpha">
    </div>
    <div class="form-row">
        <label for="node-input-beta"> beta</label>
        <input type="text" id="node-input-beta">
    </div>
    <div class="form-row">
        <label for="node-input-filter"><i class="fa fa-filter"></i> filter time</label>
        <input type="number" id="node-input-filter" style="width:70px;" placeholder="Time">
        <select id="node-input-filterUnit" style="width:140px;">
            <option value="msecs">MilliSeconds</option>
            <option value="secs">Seconds</option>
            <option value="mins">Minutes</option>
            <option value="hours">Hours</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-filterVal"><i class="fa fa-filter"></i> filter value</label>
        <input type="text" id="node-input-filterVal">
    </div>
    <div class="form-row">
        <label for="node-input-filterMul"><i class="fa fa-filter"></i> filter repetition</label>
        <input type="text" id="node-input-filterMul">
    </div>
    <div class="form-row">
        <label for="node-input-decimals"><i class="fa fa-sort-numeric-asc"></i> decimals</label>
        <input type="number" id="node-input-decimals">
    </div>
    <div class="form-row">
        <label for="node-input-zeroIsZero"><i class="fa fa-exclamation-circle"></i> null is null</label>
        <input type="checkbox" id="node-input-zeroIsZero" style="display:inline-block; width:20px; vertical-align:baseline;">
    </div>
    <div class="form-row">
        <label for="node-input-showStatus"><i class="fa fa-star-o"></i> status</label>
        <input type="checkbox" id="node-input-showState" style="display:inline-block; width:20px; vertical-align:baseline;">
    </div>
</script>

<script type="text/html" data-help-name="lowpass">
    
    <p>Filter the values of one or more data streams with a recursive low pass filter.</p>
    <p>If the msg property <code>invalid</code> is present in the message, all nodes ignore the message.</p>

    <h3>Input</h3>
    
    <p>The different inputs are differentiated by topics.</p>
    <p>The message property to be used as payload can be defined with the <code>Property</code> property.</p>
    
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> name of the input channel.</dd>
        <dt>payload <span class="property-type">number</span></dt>
        <dd> input value for <code>topic</code>.</dd>
    </dl>
    
    <h3>Output</h3>
    
    <dl class="message-properties">
        <dt>payload <span class="property-type">number</span></dt>
        <dd> filtered value.</dd>
    </dl>
    
    <h3>Parameter</h3>

    <dl class="message-properties">
        <dt>Topic <span class="property-type">string</span></dt>
        <dd> defines the topic for the output message, "" is <code>msg.topic</code>.</dd>
        <dt>Property <span class="property-type">string</span></dt>
        <dd> defines the message property to be used as payload.</dd>
        
        <dt>Filterzeit <span class="property-type">number</span></dt>
        <dd> send output only after this time.</dd>
        <dt>Filter Wert <span class="property-type">number</span></dt>
        <dd> send output only if change is bigger.</dd>
        <dt>Filter Wiederholungsfaktor <span class="property-type">number</span></dt>
        <dd> do send output if change is lower then <code>Filter Wert</code> after n times <code>Filterzeit</code>.</dd>
        <dt>Nachkommastellen <span class="property-type">number</span></dt>
        <dd> Anzahl an Nachkommastellen..</dd>
        <dt>Null ist Null <span class="property-type">boolean</span></dt>
        <dd> If 0 is received, 0 is send immediately.</dd>
        <dt>Status <span class="property-type">boolean</span></dt>
        <dd> shows the actual value as a node status.</dd>
    </dl>
</script>

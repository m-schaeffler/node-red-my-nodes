<script type="text/javascript">
    RED.nodes.registerType('matterServer',{
        category: 'input',
        color: '#008B8B',
        defaults: {
            name: {value:""},
            host: {value:"", required:true},
            port: {value:"5580", required:true, validate:RED.validators.number()},
            renaming:{value:"[]",required:true},
            statusPrefix:{value:""},
            eventPrefix:{value:""},
            onlinePrefix:{value:""},
            contextVar:{value:""}
        },
        inputs:1,
        outputs:4,
        icon: "matter.svg",
        label: function() {
            return this.name||this.host||"Matter Server";
        },
        labelStyle: function() {
            return this.name?"node_label_italic":"";
        },
        paletteLabel: "Matter",
        inputLabels: 'command',
        outputLabels: ['received data','received events','node online state','connection status'],
        oneditprepare: function() {
            const node = this;
            // Devices-List
            const renamingsList = $("#node-input-renaming-container").css('min-height','150px').css('min-width','450px').editableList({
                addItem: function(container,i,rename) {
                    container.css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap'
                    });
                    const row = $('<div/>').appendTo(container);
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('id')
                        .appendTo(row);
                    const propertyId = $('<input/>',{class:"node-input-renaming-id",type:"text"})
                        .css("width","70")
                        .appendTo(row)
                        .typedInput({types:['num']});
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('/')
                        .appendTo(row);
                    const propertyEndpoint = $('<input/>',{class:"node-input-renaming-endpoint",type:"text"})
                        .css("width","60")
                        .appendTo(row)
                        .typedInput({types:['num']});
                    $('<div/>',{style: 'display:inline-block; padding:0px 6px;'})
                        .text('name')
                        .appendTo(row);
                    const propertyName = $('<input/>',{class:"node-input-renaming-name",type:"text"})
                        .css("width","350")
                        .appendTo(row)
                        .typedInput({types:['str']});
                    propertyId      .typedInput('value',rename.id      ?? "");
                    propertyEndpoint.typedInput('value',rename.edpoint ?? 0);
                    propertyName    .typedInput('value',rename.name    ?? "");
                },
                sortable: true,
                removable: true
            });
            console.log(this.renaming)
            const help = JSON.parse( this.renaming ?? "[]" );
            for( const v of help ) {
                renamingsList.editableList('addItem',v);
            }
        },
        oneditresize: function(size) {
            const rows = $("#dialog-form>div:not(.node-input-renaming-container-row)");
            let height = size.height;
            for(let i=0; i<rows.length; i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            const editorRow = $("#dialog-form>div.node-input-renaming-container-row");
            height -= (parseInt(editorRow.css("marginTop"))+parseInt(editorRow.css("marginBottom")));
            $("#node-input-renaming-container").editableList('height',height);
        },
        oneditsave: function() {
            const renaming = $("#node-input-renaming-container").editableList('items');
            let help = [];
            renaming.each(function(i) {
                const rename = $(this);
                const id       = rename.find(".node-input-renaming-id")      .typedInput('value');
                const endpoint = rename.find(".node-input-renaming-endpoint").typedInput('value');
                const name     = rename.find(".node-input-renaming-name")    .typedInput('value');
                help.push( { id: id, endpoint: endpoint, name: name } );
            });
            console.log(JSON.stringify( help ))
            this.renaming = JSON.stringify( help );
        }
    });
</script>

</script>

<script type="text/x-red" data-help-name="matterServer">

    <p>This node connects to a matter.js server, decodes received data (Matter attributes and events) and controls nodes via Matter commands.</p>
    
    <h3>Input</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> comnmand to be executed by the server or name of the node to be controlled.</dd>
        <dt>payload <span class="property-type"></span></dt>
        <dd> data for the control of a node.</dd>
    </dl>

    <h4>Server Commands</h4>

    <ul>
      <li><code>open</code> opens the connection to the server</li>
      <li><code>close</code> closes the connection to the server</li>
      <li><code>get_nodes</code> rereads all avaliable nodes, normally not neccessary</li>
      <li><code>ping_node</code> pings the node with its node id in the <code>paylod</code></li>
      <li><code>get_thread_border_routers</code> requests all available TBRs; data is outputed via <code>node.warn</code></li>
      <li><code>get_thread_diagnostics</code> requests available Thread diag data; data is outputed via <code>node.warn</code></li>
    </ul>

    <h4>Node Control</h4>

    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> name of the device ( + number of the endpoint ).</dd>
        <dt>payload <span class="property-type">object</span></dt>
        <dd> command and data.</dd>
        <dt>payload.command <span class="property-type">string</span></dt>
        <dd> command in the form <code>clustername.commandname</code>.</dd>
        <dt>payload.data <span class="property-type">object</span></dt>
        <dd> data for this command.</dd>
    </dl>

    <p>additional commands:</p>
    <ul>
      <li><code>rvc.clean</code> starts a vacuum robot for the rooms in the <code>data</code> array.</li>
      <li><code>rvc.stop</code></li>
      <li><code>windowcovering.gotolift</code> moves the cover to the <code>data</code> position.</li>
    </ul>
    
    <h3>Outputs</h3>
    
    <h4>Received Data</h4>
    <p>Received and decoded values of selected cluster attributes  the node.</p>
    
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> <code>State-Prefix</code> + name of the device ( + number of the endpoint )</dd>
        <dt>payload <span class="property-type">object</span></dt>
        <dd> decoded state (attribute) data.</dd>
    </dl>
    
    <h4>Received Events</h4>
    <p>Received and decoded events of the node.</p>
    
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> <code>Event-Prefix</code> + name of the device ( + number of the endpoint )</dd>
        <dt>payload <span class="property-type">object</span></dt>
        <dd> data of the decoded event.</dd>
    </dl>

    <h4>Node Online State</h4>
    <p>Online status of the node as reported by the matter.js server.</p>

    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd> <code>Online-Prefix</code> + name of the device ( + number of the endpoint )</dd>
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd> online status of the node.</dd>
    </dl>

    <h4>state</h4>
    <p>Actual state of the websocket connection.</p>

    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd> state of the websocket.</dd>
    </dl>
    
    <h3>Parameters</h3>
    <dl class="message-properties">
        <dt>host <span class="property-type">string</span></dt>
        <dd> hostname of the matter.js server.</dd>
        <dt>port <span class="property-type">number</span></dt>
        <dd> port for the websocket API.</dd>
        <dt>statusPrefix <span class="property-type">string</span></dt>
        <dd> prefix for the topic for state / data output.</dd>
        <dt>eventPrefix <span class="property-type">string</span></dt>
        <dd> prefix for the topic for event output.</dd>
        <dt>onlinePrefix <span class="property-type">string</span></dt>
        <dd> prefix for the topic for online output.</dd>
        <dt>contextVar <span class="property-type">string</span></dt>
        <dd> name of the variable in flow context storage.</dd>
    </dl>
    
</script>

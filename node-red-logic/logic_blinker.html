<script type="text/javascript">
    RED.nodes.registerType('blinker',{
        category: 'logic',
        color: "#C0DEED",
        defaults: {
            name:{value:""},
            property:{value:"payload",required:true},
            onTime:{value:"1",required:true},
            onTimeUnit:{value:"secs"},
            offTime:{value:"1",required:true},
            offTimeUnit:{value:"secs"},
            outputFirst:{value:true},
            outputFirstType:{value:"bool"},
            outputOn:{value:true,required:true},
            outputOnType:{value:"bool"},
            outputOff:{value:false,required:true},
            outputOffType:{value:"bool"},
            outputLast:{value:false},
            outputLastType:{value:"bool"},
            filter:{value:false},
            showState:{value:false}
        },
        inputs:1,
        outputs:1,
        icon: "font-awesome/fa-refresh",
        label: function() {
            return this.name||"blinker";
        },
        labelStyle: function() {
            return this.name?"node_label_italic":"";
        },
        paletteLabel: "blinker",
        inputLabels: 'input',
        outputLabels: 'blinken',
        oneditprepare: function() {
            $("#node-input-property").typedInput({
                type:"msg",
                types:["msg"],
                typeField: "#node-input-property-type"
            })
            var optionNothing = {value:"nul",label:"none",hasValue:false};
            var optionMessage = {value:"msg",label:"message",hasValue:false};
            $("#node-input-outputFirst").typedInput({
                type:"bool",
                types:["str","num","bool","json",optionNothing,optionMessage],
                typeField: "#node-input-outputFirstType"
            })
            $("#node-input-outputOn").typedInput({
                type:"bool",
                types:["str","num","bool","json"],
                typeField: "#node-input-outputOnType"
            })
            $("#node-input-outputOff").typedInput({
                type:"bool",
                types:["str","num","bool","json"],
                typeField: "#node-input-outputOffType"
            })
            $("#node-input-outputLast").typedInput({
                type:"bool",
                types:["str","num","bool","json",optionNothing,optionMessage],
                typeField: "#node-input-outputLastType"
            })
        }
    });
</script>

<script type="text/html" data-template-name="blinker">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-property"><i class="fa fa-ellipsis-h"></i> Eigenschaft</label>
        <input type="text" id="node-input-property">
        <input type="hidden" id="node-input-property-type">
    </div>
    <div class="form-row">
        <label for="node-input-onTime"><i class="fa fa-hourglass-start"></i> on time</label>
        <input type="number" id="node-input-onTime" style="width:70px;" placeholder="Time">
        <select id="node-input-onTimeUnit" style="width:140px;">
            <option value="msecs">MilliSeconds</option>
            <option value="secs">Seconds</option>
            <option value="mins">Minutes</option>
            <option value="hours">Hours</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-offTime"><i class="fa fa-hourglass-end"></i> off time</label>
        <input type="number" id="node-input-offTime" style="width:70px;" placeholder="Time">
        <select id="node-input-offTimeUnit" style="width:140px;">
            <option value="msecs">MilliSeconds</option>
            <option value="secs">Seconds</option>
            <option value="mins">Minutes</option>
            <option value="hours">Hours</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-outputFirst"><i class="fa fa-sign-out"></i> 1st Output</label>
        <input type="text" id="node-input-outputFirst">
        <input type="hidden" id="node-input-outputFirstType">
    </div>
    <div class="form-row">
        <label for="node-input-outputOn"><i class="fa fa-sign-out"></i> on Output</label>
        <input type="text" id="node-input-outputOn">
        <input type="hidden" id="node-input-outputOnType">
    </div>
    <div class="form-row">
        <label for="node-input-outputOff"><i class="fa fa-sign-out"></i> off Output</label>
        <input type="text" id="node-input-outputOff">
        <input type="hidden" id="node-input-outputOffType">
    </div>
    <div class="form-row">
        <label for="node-input-outputLast"><i class="fa fa-sign-out"></i> last Output</label>
        <input type="text" id="node-input-outputLast">
        <input type="hidden" id="node-input-outputLastType">
    </div>
    <div class="form-row">
        <label for="node-input-filter"><i class="fa fa-filter"></i> Filter</label>
        <input type="checkbox" id="node-input-filter" style="display:inline-block; width:20px; vertical-align:baseline;">
    </div>
    <div class="form-row">
        <label for="node-input-howStatus"><i class="fa fa-star-o"></i> Status</label>
        <input type="checkbox" id="node-input-showState" style="display:inline-block; width:20px; vertical-align:baseline;">
    </div>
</script>

<script type="text/html" data-help-name="blinker">
    
    <p>.</p>
    <p>If the msg property <code>invalid</code> is present in the message, all nodes ignore the message.</p>
    
    <table>
      <tr> <th>type</th> <th>input</th> <th>output</th> </tr>
      <tr> <td>boolean</td> <td>false</td> <td>false</td> </tr>
      <tr> <td></td> <td>true</td> <td>true</td> </tr>
      <tr> <td>number</td> <td>0</td> <td>false</td> </tr>
      <tr> <td></td> <td>1</td> <td>true</td> </tr>
      <tr> <td>string</td> <td>false</td> <td>false</td> </tr>
      <tr> <td></td> <td>true</td> <td>true</td> </tr>
      <tr> <td></td> <td>0</td> <td>false</td> </tr>
      <tr> <td></td> <td>1</td> <td>true</td> </tr>
      <tr> <td></td> <td>off</td> <td>false</td> </tr>
      <tr> <td></td> <td>on</td> <td>true</td> </tr>
    </table> 

    <h3>Input</h3>
    
    <p>The message property to be used as payload can be defined with the <code>Property</code> property.</p>
    
    <dl class="message-properties">
        <dt>payload <span class="property-type"></span></dt>
        <dd> input value.</dd>
    </dl>
    
    <h3>Output</h3>
    
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd> blinking signal.</dd>
        <dt>state <span class="property-type">boolean</span></dt>
        <dd> received boolean value.</dd>
    </dl>
    
    <h3>Parameter</h3>

    <dl class="message-properties">
        <dt>Property <span class="property-type">string</span></dt>
        <dd> defines the message property to be used as payload.</dd>
        <dt>on time <span class="property-type">number</span></dt>
        <dd> time to be in on state.</dd>
        <dt>off time <span class="property-type">number</span></dt>
        <dd> time to be in off state.</dd>
        <dt>first Output <span class="property-type">multi</span></dt>
        <dd> value to be sent as first (on) mesage.</dd>
        <dt>on Output <span class="property-type">multi</span></dt>
        <dd> value to be sent in on case inside the sequence.</dd>
        <dt>off Output <span class="property-type">multi</span></dt>
        <dd> value to be sent in off case inside the sequence.</dd>
        <dt>Status <span class="property-type">boolean</span></dt>
        <dt>last Output <span class="property-type">multi</span></dt>
        <dd> value to be sent as last (off) message.</dd>
        <dt>Filter <span class="property-type">boolean</span></dt>
        <dd> block sending of unchanged <code>property</code>.</dd>
        <dt>Status <span class="property-type">boolean</span></dt>
        <dd> shows the actual value as a node status.</dd>
    </dl>
    
</script>
